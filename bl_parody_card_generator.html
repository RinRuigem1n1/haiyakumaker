<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f3ea" />
  <title>配役札｜BLパロディ職業メーカー</title>
  <style>
    :root{
      --paper:#f7f3ea;
      --paper-deep:#eee5d4;
      --card:#e9dfcc;
      --ink:#312c27;
      --muted:#91877b;
      --line:#b9ae9e;
      --red:#c94435;
      --red-dark:#a83228;
      --gold:#b78a42;
      --shadow:0 18px 46px rgba(65,50,30,.14);
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",
        "Noto Serif JP",serif;
      background:
        radial-gradient(circle at 18% 8%,rgba(255,255,255,.9),transparent 32%),
        radial-gradient(circle at 92% 72%,rgba(213,187,145,.14),transparent 34%),
        linear-gradient(180deg,#fbf9f4 0%,var(--paper) 100%);
      padding:34px 16px 56px;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.16;
      background-image:
        repeating-linear-gradient(0deg,rgba(90,70,45,.035) 0 1px,transparent 1px 4px);
      mix-blend-mode:multiply;
    }

    .wrap{
      width:min(760px,100%);
      margin:0 auto;
      position:relative;
      z-index:1;
    }

    header{
      text-align:center;
      padding:8px 0 28px;
    }

    .eyebrow{
      margin:0 0 14px;
      color:#8d8377;
      font-family:Georgia,"Times New Roman",serif;
      letter-spacing:.34em;
      font-size:clamp(11px,2.4vw,15px);
    }

    h1{
      margin:0;
      font-size:clamp(40px,10vw,68px);
      font-weight:600;
      letter-spacing:.09em;
      line-height:1.1;
    }

    .lead{
      margin:18px 0 0;
      color:#655d55;
      font-size:clamp(14px,3.6vw,19px);
      letter-spacing:.08em;
    }

    .name-grid{
      display:grid;
      grid-template-columns:1fr 52px 1fr;
      gap:14px;
      align-items:end;
      margin:24px 0 28px;
    }

    .name-field label{
      display:block;
      margin:0 0 9px;
      text-align:center;
      color:var(--muted);
      font-size:18px;
      letter-spacing:.3em;
    }

    .name-field input{
      width:100%;
      border:none;
      border-bottom:2px solid var(--gold);
      background:transparent;
      color:var(--ink);
      text-align:center;
      font:600 clamp(25px,6vw,36px)/1.3 "Hiragino Mincho ProN","Yu Mincho",serif;
      padding:10px 6px 12px;
      outline:none;
      border-radius:0;
    }

    .name-field:first-child input{border-bottom-color:var(--red)}

    .name-field input:focus{
      background:rgba(255,255,255,.42);
      box-shadow:0 8px 18px rgba(80,55,30,.05);
    }

    .name-x{
      height:57px;
      display:grid;
      place-items:center;
      color:#6a6259;
      font-size:25px;
    }

    .card{
      position:relative;
      min-height:520px;
      display:grid;
      place-items:center;
      padding:54px 26px 72px;
      background:linear-gradient(135deg,#eee6d7 0%,#e7dcc8 100%);
      border:2px solid #c9bea9;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:16px;
      border:2px solid rgba(118,105,87,.42);
      pointer-events:none;
    }

    .card::after{
      content:"";
      position:absolute;
      inset:0;
      opacity:.18;
      background-image:
        repeating-linear-gradient(90deg,rgba(85,67,45,.025) 0 1px,transparent 1px 5px);
      pointer-events:none;
    }

    .card-content{
      width:100%;
      position:relative;
      z-index:1;
      text-align:center;
    }

    .card-title{
      margin:0 0 38px;
      color:#958a7c;
      letter-spacing:.28em;
      font-size:16px;
    }

    .roles{
      display:grid;
      grid-template-columns:1fr 56px 1fr;
      gap:12px;
      align-items:center;
    }

    .role-side{
      min-width:0;
    }

    .role-label{
      margin:0 0 17px;
      font-family:Arial,sans-serif;
      font-weight:700;
      letter-spacing:.28em;
      font-size:15px;
    }

    .role-label.seme{color:var(--red)}
    .role-label.uke{color:var(--gold)}

    .occupation{
      min-height:56px;
      display:grid;
      place-items:end center;
      font-size:clamp(26px,6vw,40px);
      font-weight:600;
      line-height:1.2;
      overflow-wrap:anywhere;
    }

    .person-name{
      min-height:62px;
      display:grid;
      place-items:center;
      font-size:clamp(34px,8vw,50px);
      font-weight:600;
      line-height:1.2;
      overflow-wrap:anywhere;
    }

    .role-x{
      font-size:31px;
      color:#4f4841;
      margin-top:42px;
    }

    .type-line{
      margin:42px 0 0;
      color:#9a9083;
      letter-spacing:.16em;
      font-size:15px;
    }

    .stamp{
      position:absolute;
      right:34px;
      bottom:28px;
      width:94px;
      height:94px;
      display:grid;
      place-items:center;
      border:4px solid rgba(185,55,43,.76);
      border-radius:8px;
      color:rgba(185,55,43,.82);
      font-weight:700;
      font-size:21px;
      line-height:1.2;
      transform:rotate(-7deg);
      z-index:2;
      opacity:.9;
    }

    .controls{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      margin-top:34px;
    }

    .draw{
      width:190px;
      height:190px;
      border:none;
      border-radius:50%;
      color:white;
      background:linear-gradient(145deg,#d64b3b,#ba3529);
      box-shadow:
        0 0 0 12px #eee3d2,
        0 0 0 14px #d7c8b1,
        0 17px 32px rgba(153,49,39,.22);
      font:600 30px/1.25 "Hiragino Mincho ProN","Yu Mincho",serif;
      letter-spacing:.14em;
      cursor:pointer;
      transition:transform .14s ease,filter .2s ease;
    }

    .draw:hover{filter:brightness(1.03)}
    .draw:active{transform:scale(.97)}

    .count{
      color:#8e8276;
      font-size:15px;
      letter-spacing:.08em;
    }

    .sub-actions{
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:8px;
    }

    .sub-actions button{
      min-height:52px;
      border:1px solid #c9baa4;
      border-radius:4px;
      background:rgba(255,255,255,.5);
      color:#554c43;
      font:600 15px "Hiragino Mincho ProN","Yu Mincho",serif;
      letter-spacing:.08em;
      cursor:pointer;
    }

    .history{
      margin-top:34px;
      padding:25px 22px;
      border:1px solid #d7cbb9;
      background:rgba(255,255,255,.42);
      box-shadow:0 10px 26px rgba(64,49,30,.06);
    }

    .history h2{
      margin:0 0 18px;
      text-align:center;
      font-size:19px;
      font-weight:600;
      letter-spacing:.18em;
    }

    .history-list{
      display:grid;
      gap:10px;
    }

    .history-item{
      padding:12px 14px;
      border-bottom:1px dashed #cfc2af;
      color:#5d554d;
      font-size:15px;
      line-height:1.7;
      text-align:center;
    }

    .empty{
      text-align:center;
      color:#9a9086;
      font-size:14px;
    }

    .pop{animation:pop .36s ease}
    .stamp-pop{animation:stamp .42s cubic-bezier(.2,.9,.24,1.15)}

    @keyframes pop{
      0%{opacity:0;transform:translateY(10px)}
      100%{opacity:1;transform:translateY(0)}
    }

    @keyframes stamp{
      0%{opacity:0;transform:scale(1.7) rotate(-13deg)}
      100%{opacity:.9;transform:scale(1) rotate(-7deg)}
    }

    @media(max-width:580px){
      body{padding-top:24px}
      .name-grid{grid-template-columns:1fr 32px 1fr;gap:8px}
      .card{min-height:480px;padding:45px 16px 70px}
      .card::before{inset:12px}
      .roles{grid-template-columns:1fr 32px 1fr;gap:6px}
      .role-x{font-size:25px}
      .stamp{right:24px;bottom:22px;width:78px;height:78px;font-size:17px}
      .draw{width:160px;height:160px;font-size:26px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">RANDOM PARODY DRAW</p>
      <h1>配役札</h1>
      <p class="lead">攻めと受けの名前を入れて、札をめくる</p>
    </header>

    <section class="name-grid" aria-label="名前入力">
      <div class="name-field">
        <label for="semeName">攻</label>
        <input id="semeName" value="蘭丸" maxlength="20" autocomplete="off" />
      </div>
      <div class="name-x">×</div>
      <div class="name-field">
        <label for="ukeName">受</label>
        <input id="ukeName" value="嶺二" maxlength="20" autocomplete="off" />
      </div>
    </section>

    <section class="card" aria-live="polite">
      <div class="card-content" id="cardContent">
        <p class="card-title">— 今回の配役 —</p>

        <div class="roles">
          <div class="role-side">
            <p class="role-label seme">攻 SEME</p>
            <div class="occupation" id="semeOccupation">怪盗の</div>
            <div class="person-name" id="semeDisplay">蘭丸</div>
          </div>

          <div class="role-x">×</div>

          <div class="role-side">
            <p class="role-label uke">受 UKE</p>
            <div class="occupation" id="ukeOccupation">警備員の</div>
            <div class="person-name" id="ukeDisplay">嶺二</div>
          </div>
        </div>

        <p class="type-line">〔 職業 × 職業 〕</p>
      </div>

      <div class="stamp" id="stamp">配役<br>確定</div>
    </section>

    <section class="controls">
      <button class="draw" id="drawButton">札を<br>引く</button>
      <div class="count"><span id="drawCount">0</span>回目</div>

      <div class="sub-actions">
        <button id="copyButton">結果をコピー</button>
        <button id="clearButton">履歴を消す</button>
      </div>
    </section>

    <section class="history">
      <h2>これまでの配役</h2>
      <div class="history-list" id="historyList">
        <div class="empty">札を引くと、ここに履歴が残ります</div>
      </div>
    </section>
  </main>

  <script>
    const occupations = [
      "会社員","上司","部下","社長","秘書","御曹司","経営者","営業職","広報担当","人事担当",
      "医者","外科医","内科医","小児科医","精神科医","救命医","獣医","看護師","薬剤師","研究医",
      "教師","高校教師","大学教授","保健医","生徒","高校生","大学生","大学院生","塾講師","家庭教師",
      "弁護士","検事","裁判官","政治家","官僚","外交官","研究者","科学者","学芸員","司書",
      "編集者","小説家","脚本家","漫画家","イラストレーター","写真家","記者","アナウンサー","通訳","翻訳家",
      "俳優","アイドル","歌手","声優","モデル","ダンサー","作曲家","ピアニスト","ギタリスト","バンドマン",
      "映画監督","舞台俳優","芸能マネージャー","プロデューサー","スタイリスト","メイクアップアーティスト",
      "パティシエ","シェフ","料理人","バーテンダー","バリスタ","カフェ店員","パン職人","和菓子職人","ソムリエ",
      "花屋","書店員","古書店主","雑貨屋店主","美容師","調香師","宝石商","時計職人","陶芸家","仕立て屋",
      "ホテルマン","ホテル支配人","コンシェルジュ","旅館の若旦那","客室乗務員","パイロット","駅員","車掌","船長","航海士",
      "刑事","警察官","探偵","怪盗","犯人","警備員","SP","ボディーガード","消防士","救急隊員",
      "海上保安官","自衛官","軍人","傭兵","狙撃手","看守","囚人","執行人","用心棒","番人",
      "マフィア","ヤクザ","若頭","組長","殺し屋","スパイ","情報屋","ハッカー","賞金稼ぎ","密輸人",
      "闇医者","詐欺師","盗賊","海賊","ギャンブラー","カジノディーラー","ホスト","コンカフェ店員",
      "農家","漁師","牧場主","庭師","飼育員","トリマー","登山家","冒険家","考古学者","探検家",
      "建築士","大工","整備士","エンジニア","プログラマー","ゲームクリエイター","配信者","動画編集者",
      "僧侶","神父","牧師","神主","シスター","神官","陰陽師","祓魔師","占い師","霊媒師",
      "王","王子","皇帝","皇子","貴族","公爵","伯爵","領主","騎士","近衛騎士","騎士団長","聖騎士",
      "剣士","勇者","魔王","魔法使い","魔術師","賢者","錬金術師","召喚士","薬師","旅人",
      "吟遊詩人","預言者","聖職者","狩人","鍛冶師","薬草師","商人","行商人","竜騎士","吸血鬼ハンター",
      "天使","堕天使","悪魔","インキュバス","吸血鬼","人狼","狼男","妖","妖怪","妖狐",
      "九尾","鬼","天狗","河童","雪男","付喪神","神様","人魚","セイレーン","竜",
      "ドラゴン","竜人","エルフ","精霊","妖精","魔族","半妖","死神","幽霊","ゴースト",
      "不老不死","人造人間","アンドロイド","AI","宇宙飛行士","宇宙海賊","異星人","宇宙人","神獣","使い魔",
      "執事","メイド","従者","主人","家令","護衛","家庭医","奴隷","人形師","人形",
      "忍者","侍","武士","剣豪","大名","若殿","陰陽師","サーカス団員","マジシャン","ピエロ",
      "生徒会長","副会長","風紀委員","図書委員","放送委員","保健委員","用務員","部活動顧問",
      "VTuber","YouTuber","トレーナー","スポーツ選手","ボクサー","レーサー","騎手","プロゲーマー"
    ];

    const semeName = document.getElementById("semeName");
    const ukeName = document.getElementById("ukeName");
    const semeDisplay = document.getElementById("semeDisplay");
    const ukeDisplay = document.getElementById("ukeDisplay");
    const semeOccupation = document.getElementById("semeOccupation");
    const ukeOccupation = document.getElementById("ukeOccupation");
    const cardContent = document.getElementById("cardContent");
    const stamp = document.getElementById("stamp");
    const drawButton = document.getElementById("drawButton");
    const drawCount = document.getElementById("drawCount");
    const copyButton = document.getElementById("copyButton");
    const clearButton = document.getElementById("clearButton");
    const historyList = document.getElementById("historyList");

    let count = 0;
    let currentResult = "怪盗の蘭丸 × 警備員の嶺二";
    let history = [];

    function randomOccupation(exclude = "") {
      let result;
      do {
        result = occupations[Math.floor(Math.random() * occupations.length)];
      } while (occupations.length > 1 && result === exclude);
      return result;
    }

    function getNames() {
      return {
        seme: semeName.value.trim() || "攻め",
        uke: ukeName.value.trim() || "受け"
      };
    }

    function syncNames() {
      const names = getNames();
      semeDisplay.textContent = names.seme;
      ukeDisplay.textContent = names.uke;
    }

    function draw() {
      const names = getNames();
      const semeRole = randomOccupation();
      const ukeRole = randomOccupation(semeRole);

      semeOccupation.textContent = `${semeRole}の`;
      ukeOccupation.textContent = `${ukeRole}の`;
      semeDisplay.textContent = names.seme;
      ukeDisplay.textContent = names.uke;

      currentResult = `${semeRole}の${names.seme} × ${ukeRole}の${names.uke}`;
      count += 1;
      drawCount.textContent = count;

      history.unshift(currentResult);
      history = history.slice(0, 10);
      renderHistory();

      cardContent.classList.remove("pop");
      stamp.classList.remove("stamp-pop");
      void cardContent.offsetWidth;
      cardContent.classList.add("pop");
      stamp.classList.add("stamp-pop");

      try {
        localStorage.setItem("parodyDrawCount", String(count));
        localStorage.setItem("parodyHistory", JSON.stringify(history));
        localStorage.setItem("parodySemeName", names.seme);
        localStorage.setItem("parodyUkeName", names.uke);
      } catch (e) {
        // プレビュー環境などで保存機能が使えなくても、抽選自体は動かします。
      }
    }

    function renderHistory() {
      if (!history.length) {
        historyList.innerHTML = '<div class="empty">札を引くと、ここに履歴が残ります</div>';
        return;
      }

      historyList.innerHTML = history
        .map((item, index) => `<div class="history-item">${index + 1}. ${escapeHtml(item)}</div>`)
        .join("");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function copyResult() {
      try {
        await navigator.clipboard.writeText(currentResult);
      } catch {
        const area = document.createElement("textarea");
        area.value = currentResult;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }

      const original = copyButton.textContent;
      copyButton.textContent = "コピーしました";
      setTimeout(() => copyButton.textContent = original, 1200);
    }

    function clearHistory() {
      history = [];
      count = 0;
      drawCount.textContent = "0";
      renderHistory();
      try {
        localStorage.removeItem("parodyDrawCount");
        localStorage.removeItem("parodyHistory");
      } catch (e) {}
    }

    function restore() {
      try {
        const savedCount = Number(localStorage.getItem("parodyDrawCount") || 0);
        const rawHistory = localStorage.getItem("parodyHistory") || "[]";
        let savedHistory = [];
        try { savedHistory = JSON.parse(rawHistory); } catch (e) { savedHistory = []; }
        const savedSeme = localStorage.getItem("parodySemeName");
        const savedUke = localStorage.getItem("parodyUkeName");

        if (savedSeme) semeName.value = savedSeme;
        if (savedUke) ukeName.value = savedUke;
        count = Number.isFinite(savedCount) ? savedCount : 0;
        history = Array.isArray(savedHistory) ? savedHistory.slice(0, 10) : [];
      } catch (e) {
        count = 0;
        history = [];
      }
      drawCount.textContent = count;
      syncNames();
      renderHistory();
    }

    semeName.addEventListener("input", syncNames);
    ukeName.addEventListener("input", syncNames);
    semeName.addEventListener("keydown", e => { if (e.key === "Enter") draw(); });
    ukeName.addEventListener("keydown", e => { if (e.key === "Enter") draw(); });
    drawButton.addEventListener("click", draw);
    copyButton.addEventListener("click", copyResult);
    clearButton.addEventListener("click", clearHistory);

    restore();
  </script>
</body>
</html>
